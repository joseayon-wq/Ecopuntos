<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - EcoPuntos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="menu-lateral">
    <h2>EcoPuntos</h2>
    <a href="perfil.html" class="activo">Mi Perfil</a>
    <a href="ranking.html">Ranking</a>
    <a href="tienda.html">Tienda</a>
    <a href="#" onclick="cerrarSesion()" class="mt-auto text-warning mt-md-auto mt-2">Cerrar Sesión</a>
  </div>

  <div class="contenido-principal">
    <h2 class="fw-bold mb-4">Hola, <span id="nombrePerfil">...</span></h2>

    <div class="row g-4">
      <div class="col-12 col-md-5">
        <div class="tarjeta tarjeta-puntos text-center">
          <h5 class="fw-light">Mis Puntos Totales</h5>
          <h1 class="display-3 fw-bold" id="puntosPerfil">0</h1>
          <p class="m-0">Posición actual: <strong id="posicionPerfil">#--</strong></p>
        </div>
      </div>

      <div class="col-12 col-md-7">
        <div class="tarjeta">
          <h5 class="fw-bold mb-3">Mis Datos</h5>
          <p><strong>Correo:</strong> <span id="correoPerfil"></span></p>
          <p><strong>Grupo:</strong> <span id="grupoPerfil"></span></p>
          <hr>
          <a href="tienda.html" class="btn boton-verde w-100">Ir a la Tienda de Premios</a>
        </div>
      </div>
    </div>

    <div class="tarjeta mt-2">
      <h5 class="fw-bold mb-3">Historial de Actividades</h5>
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Reciclaje de PET <span class="badge bg-success rounded-pill">+50 pts</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Limpieza de áreas verdes <span class="badge bg-success rounded-pill">+100 pts</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Separación de residuos <span class="badge bg-success rounded-pill">+75 pts</span>
        </li>
      </ul>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    protegerPagina();
    mostrarPerfil();
  </script>
</body>
</html>
