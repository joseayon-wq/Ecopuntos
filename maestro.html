<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Maestro - EcoPuntos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="menu-lateral">
    <h2>EcoPuntos</h2>
    <a href="maestro.html" class="activo">Panel Maestro</a>
    <a href="ranking.html">Ranking</a>
    <a href="#" onclick="cerrarSesion()" class="mt-auto text-warning mt-md-auto mt-2">Cerrar Sesión</a>
  </div>

  <div class="contenido-principal">
    <h2 class="fw-bold mb-4">Gestión de Jornadas</h2>

    <div class="row g-4">
      <div class="col-12 col-md-5">
        <div class="tarjeta">
          <h5 class="fw-bold mb-3">Asignar puntos</h5>
          <form>
            <div class="mb-3">
              <label class="form-label">Grupo o alumno</label>
              <input type="text" class="form-control" placeholder="Ej. 5°ATP - Guillermo" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Tipo de jornada</label>
              <select class="form-select">
                <option>Reciclaje de PET</option>
                <option>Limpieza de áreas verdes</option>
                <option>Separación de residuos</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Puntos a asignar</label>
              <input type="number" class="form-control" value="50" min="1" required>
            </div>

            <button type="submit" class="btn boton-verde w-100">Registrar jornada</button>
          </form>
        </div>
      </div>

      <div class="col-12 col-md-7">
        <div class="tarjeta">
          <h5 class="fw-bold mb-3">Registros recientes</h5>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>Grupo</th>
                  <th>Jornada</th>
                  <th>Puntos</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>5°ATP</td>
                  <td>Reciclaje PET</td>
                  <td class="text-success fw-bold">+50</td>
                  <td><button class="btn btn-sm btn-outline-danger">Anular</button></td>
                </tr>
                <tr>
                  <td>3°B</td>
                  <td>Limpieza</td>
                  <td class="text-success fw-bold">+100</td>
                  <td><button class="btn btn-sm btn-outline-danger">Anular</button></td>
                </tr>
                <tr>
                  <td>1°A</td>
                  <td>Separación</td>
                  <td class="text-success fw-bold">+75</td>
                  <td><button class="btn btn-sm btn-outline-danger">Anular</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    protegerPagina();
  </script>
</body>
</html>
