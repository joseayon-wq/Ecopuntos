<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda - EcoPuntos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="menu-lateral">
    <h2>EcoPuntos</h2>
    <a href="perfil.html">Mi Perfil</a>
    <a href="ranking.html">Ranking</a>
    <a href="tienda.html" class="activo">Tienda</a>
    <a href="#" onclick="cerrarSesion()" class="mt-auto text-warning mt-md-auto mt-2">Cerrar Sesión</a>
  </div>

  <div class="contenido-principal">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
      <h2 class="fw-bold m-0">Tienda de Premios</h2>
      <span class="badge bg-success p-3 fs-6" id="puntosTienda">0 pts</span>
    </div>

    <div class="row g-4">
      <div class="col-12 col-md-4">
        <div class="tarjeta text-center h-100">
          <h5 class="fw-bold">Diploma de Reconocimiento</h5>
          <p class="text-muted small">Reconocimiento oficial por cuidar el plantel.</p>
          <h3 class="text-success fw-bold">100 pts</h3>
          <button class="btn boton-verde w-100 mt-2">Canjear</button>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="tarjeta text-center h-100">
          <h5 class="fw-bold">Kit Ecológico</h5>
          <p class="text-muted small">Cuadernos reciclados y bolígrafos ecológicos.</p>
          <h3 class="text-success fw-bold">250 pts</h3>
          <button class="btn boton-verde w-100 mt-2">Canjear</button>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="tarjeta text-center h-100 opacity-50">
          <h5 class="fw-bold">Pase VIP Biblioteca</h5>
          <p class="text-muted small">Acceso preferencial por una semana.</p>
          <h3 class="text-success fw-bold">500 pts</h3>
          <button class="btn btn-secondary w-100 mt-2" disabled>Bloqueado</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    protegerPagina();
    var datos = localStorage.getItem("alumno");
    if (datos) {
      var alumno = JSON.parse(datos);
      document.getElementById("puntosTienda").innerHTML = alumno.puntos + " pts";
    }
  </script>
</body>
</html>
