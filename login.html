<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - EcoPuntos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="min-height: 100vh; background-color: #f0f2f5;">

  <div class="w-100" style="max-width: 400px;">
    
    <a href="index.html" class="text-success text-decoration-none fw-bold mb-3 d-inline-block">
      <span class="fs-5">←</span> Volver al inicio
    </a>

    <div class="tarjeta">
      <div class="text-center mb-4">
        <h2 class="fw-bold text-success">EcoPuntos</h2>
        <p class="text-muted">Ingresa a tu cuenta</p>
      </div>

      <form onsubmit="login(event)">
        <div class="mb-3">
          <label class="form-label">Correo institucional</label>
          <input type="email" class="form-control" id="correoLogin" placeholder="alumno@cbta197.net" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="passLogin" required>
        </div>
        <button type="submit" class="btn boton-verde w-100">Entrar</button>
      </form>

      <p class="text-center mt-3 mb-0">
        ¿No tienes cuenta? <a href="registro.html" class="text-success fw-bold text-decoration-none">Regístrate</a>
      </p>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
